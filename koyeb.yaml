name: akashvani-radio-hub
services:
  - name: akashvani-radio-hub
    type: web
    docker:
      dockerfile: Dockerfile
    ports:
      - port: 8000
        protocol: http
    routes:
      - path: /
        port: 8000
    health_checks:
      - path: /health
        port: 8000
        protocol: http
        grace_period: 30
        interval: 30
        restart_limit: 3
        timeout: 5
    scalings:
      - min: 1
        max: 1
    instance_types:
      - type: nano
